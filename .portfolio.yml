case_study:
  background:
    en:
      - Bomberman AI started as a machine-learning project. The Bomberman 64-inspired 3D game was built alongside it as the training environment — a custom, deterministic, tick-authoritative simulation where every state change flows through a discrete 8-step pipeline, making any game state fully reproducible and replayable for an agent to learn from.
      - The project then pivoted from a single-game ML experiment into the Emulator ML Platform — a more general, TypeScript-first platform for training agents on emulated N64 games. The custom Bomberman engine became one environment among emulator-backed targets like N64Wasm.
      - Every backend implements one unified GameEnvironment interface. Agents, experiment sessions, and the platform UI interact only through that interface — never with engine or emulator internals — so training code is written once and runs against any game.
  pull_quote:
    en: A single GameEnvironment interface lets one agent train across a custom engine and emulated N64 games.
  numbers:
    - value: "8"
      label:
        en: Step deterministic tick pipeline
    - value: "3"
      label:
        en: Elevation levels in the surface-based 3D world
    - value: "50"
      label:
        en: Automated tests across all packages
  approach:
    body:
      en: The architecture enforces strict separation of concerns. All simulation runs in Web Workers — even the active visible game — so the renderer stays at 60fps and one code path serves live play, headless evaluation, and replay. The React GUI and React Three Fiber renderer consume derived read models, never authoritative state.
    steps:
      - en: Run all simulation in workers behind a tick-authoritative pipeline; the main thread is presentation-only.
      - en: Route every actor action through an intent system shared by players, bots, and ML models.
      - en: Wrap each game backend behind the unified GameEnvironment interface.
      - en: Host environments server-side and connect training clients over WebSocket via RemoteGameEnvironment.
